<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ESC/POS Thermal Studio</title>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('escpos-theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
            const savedLang = localStorage.getItem('escpos-lang') || 'es';
            document.documentElement.setAttribute('lang', savedLang);
        })();
    </script>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

<div class="container">
    <header>
        <h1>🖨️ ESC/POS Studio</h1>
        <div class="header-actions">
            <div id="statusIndicator" class="status-badge disconnected">
                <span class="dot"></span>
                <span id="statusText" data-i18n="statusDisconnected">Disconnected</span>
            </div>
            <button type="button" id="langToggle" class="btn-icon" title="Toggle Language">ES</button>
            <button type="button" id="themeToggle" class="btn-icon" title="Toggle Theme">🌙</button>
        </div>
    </header>

    <div id="iosAlert" class="ios-banner" data-i18n="iosWarning"></div>

    <div class="card">
        <div class="card-title" data-i18n="settingsTitle">⚙️ Printer Settings</div>
        <div class="grid-2">
            <div class="input-group">
                <label for="paperWidth" data-i18n="paperWidthLabel">Paper Width</label>
                <select id="paperWidth">
                    <option value="384" selected>58 mm (384px)</option>
                    <option value="576">80 mm (576px)</option>
                </select>
            </div>
            <div class="input-group">
                <label for="fontSize" data-i18n="fontSizeLabel">Font Size</label>
                <select id="fontSize">
                    <option value="normal" data-i18n="fontNormal" selected>Normal</option>
                    <option value="tall" data-i18n="fontTall">Double Tall</option>
                </select>
            </div>
        </div>
        <label class="checkbox-row">
            <input type="checkbox" id="autoCut" checked>
            <span data-i18n="autoCutLabel">Auto-cut paper on finish</span>
        </label>
    </div>

    <div class="card">
        <div class="card-title" data-i18n="textTitle">📝 Free Text / Header (Optional)</div>
        <textarea id="ticketText"></textarea>
    </div>

    <div class="card">
        <div class="card-title" data-i18n="imageTitle">🖼️ Image / Document</div>
        <div class="file-dropzone" onclick="document.getElementById('upload').click()">
            <span data-i18n="dropzoneText">📁 Tap to select image</span>
            <input type="file" id="upload" accept="image/*" style="display:none">
        </div>

        <div id="imageControls" class="image-controls">
            <div class="toolbar">
                <button type="button" class="btn-tool" id="rotateBtn">🔄 <span data-i18n="rotateBtn">Rotate</span> (<span id="angleLabel">0°</span>)</button>
                <button type="button" class="btn-tool danger" id="removeImgBtn">✕ <span data-i18n="removeBtn">Remove</span></button>
            </div>
            <div class="input-group" style="margin-bottom: 10px;">
                <label><span data-i18n="thresholdLabel">B&W Threshold / Contrast</span>: <strong id="thresholdVal">145</strong></label>
                <input type="range" id="thresholdRange" min="40" max="230" value="145">
            </div>
            <label data-i18n="previewLabel">Live Thermal Preview (1-bit):</label>
            <div class="preview-wrapper"></div>
        </div>
    </div>

    <div class="action-container">
        <button id="printBtn" class="btn-print">🖨️ <span data-i18n="printBtnText">Connect & Print</span></button>
    </div>
</div>

<!-- Main script loaded as ES Module -->
<script type="module" src="./js/app.js"></script>
</body>
</html>
