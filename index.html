<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impresora ESC/POS Web Bluetooth</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 20px; background: #f4f4f9; color: #333; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
        button { background: #007AFF; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 15px; font-weight: bold; }
        button:active { background: #0056b3; }
        input[type="file"] { margin: 15px 0; width: 100%; }
        img { max-width: 180px; display: block; margin: 10px auto; border: 1px solid #ddd; border-radius: 6px; }
        
        /* Indicador Visual de Estado */
        .status { display: inline-flex; align-items: center; padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: bold; margin-bottom: 20px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }
        .status.disconnected { background-color: #ffebee; color: #c62828; }
        .status.disconnected .dot { background-color: #f44336; }
        .status.connected { background-color: #e8f5e9; color: #2e7d32; }
        .status.connected .dot { background-color: #4caf50; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Impresora Térmica Web</h2>
        
        <!-- Indicador Visual -->
        <div id="statusIndicator" class="status disconnected">
            <span class="dot"></span>
            <span id="statusText">Desconectada</span>
        </div>

        <div>
            <label for="upload">Selecciona una imagen:</label>
            <input type="file" id="upload" accept="image/*">
            <img id="preview" alt="Vista previa" style="display:none;">
        </div>

        <button id="printBtn">Conectar e Imprimir</button>
    </div>

    <script>
        const statusIndicator = document.getElementById('statusIndicator');
        const statusText = document.getElementById('statusText');
        const upload = document.getElementById('upload');
        const preview = document.getElementById('preview');
        const printBtn = document.getElementById('printBtn');

        let bluetoothDevice = null;
        let bluetoothCharacteristic = null;
        let imageDataBytes = null;

        // UUID estándar común para impresoras BLE ESC/POS
        const SERVICE_UUID = '000018f0-0000-1000-8000-00805f9b34fb';
        const CHARACTERISTIC_UUID = '00002af1-0000-1000-8000-00805f9b34fb';

        function actualizarEstadoUI(conectado, mensaje) {
            if (conectado) {
                statusIndicator.className = "status connected";
                statusText.innerText = mensaje;
            } else {
                statusIndicator.className = "status disconnected";
                statusText.innerText = mensaje;
            }
        }

        // Cargar y procesar imagen a monocromático
        upload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                preview.src = event.target.result;
                preview.style.display = 'block';
                preview.onload = () => procesarImagenParaImpresora(preview);
            };
            reader.readAsDataURL(file);
        });

        function procesarImagenParaImpresora(imgElement) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            const maxWidth = 384; // 58mm
            const scale = maxWidth / imgElement.naturalWidth;
            const width = maxWidth;
            const height = Math.floor(imgElement.naturalHeight * scale);

            canvas.width = width;
            canvas.height = height;

            ctx.drawImage(imgElement, 0, 0, width, height);
            const imgData = ctx.getImageData(0, 0, width, height);
            const pixels = imgData.data;

            const bytesW = Math.ceil(width / 8);
            const bytesH = height;
            
            let rasterBuffer = [];
            // Inicializar impresora y comando raster (GS v 0)
            rasterBuffer.push(0x1B, 0x40); // ESC @ (Reset)
            rasterBuffer.push(0x1D, 0x76, 0x30, 0x00);
            rasterBuffer.push(bytesW & 0xFF, (bytesW >> 8) & 0xFF);
            rasterBuffer.push(bytesH & 0xFF, (bytesH >> 8) & 0xFF);

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < bytesW; x++) {
                    let byte = 0;
                    for (let b = 0; b < 8; b++) {
                        let pxX = (x * 8) + b;
                        if (pxX < width) {
                            let idx = (y * width + pxX) * 4;
                            let r = pixels[idx];
                            let g = pixels[idx + 1];
                            let bVal = pixels[idx + 2];
                            let alpha = pixels[idx + 3];

                            let gray = (r * 0.299 + g * 0.587 + bVal * 0.114);
                            if (alpha > 128 && gray < 128) {
                                byte |= (1 << (7 - b));
                            }
                        }
                    }
                    rasterBuffer.push(byte);
                }
            }

            // Espacio y corte al final
            rasterBuffer.push(0x1B, 0x64, 0x04); // Avanzar líneas
            imageDataBytes = new Uint8Array(rasterBuffer);
        }

        // Manejo de conexión Bluetooth
        async function conectarImpresora() {
            if (!bluetoothDevice || !bluetoothDevice.gatt.connected) {
                statusText.innerText = "Buscando impresora...";
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [SERVICE_UUID]
                });

                bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                bluetoothCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);
            }
        }

        function onDisconnected() {
            actualizarEstadoUI(false, "Desconectada - Reconectando...");
            reintentarConexion(3);
        }

        async function reintentarConexion(intentos) {
            if (intentos <= 0) {
                actualizarEstadoUI(false, "Desconectada");
                bluetoothDevice = null;
                return;
            }
            await new Promise(resolve => setTimeout(resolve, 3000));
            try {
                if (bluetoothDevice) {
                    await bluetoothDevice.gatt.connect();
                    actualizarEstadoUI(true, `Conectado a ${bluetoothDevice.name || 'Impresora'}`);
                }
            } catch (e) {
                reintentarConexion(intentos - 1);
            }
        }

        // Botón principal de impresión
        printBtn.addEventListener('click', async () => {
            try {
                await conectarImpresora();
                actualizarEstadoUI(true, `Conectado a ${bluetoothDevice.name || 'Impresora'}`);

                if (!imageDataBytes) {
                    alert("Por favor selecciona una imagen primero.");
                    return;
                }

                statusText.innerText = "Imprimiendo imagen...";

                // Envío optimizado con chunks pequeños y delay para no saturar
                const CHUNK_SIZE = 128;
                const DELAY_MS = 15;

                for (let i = 0; i < imageDataBytes.length; i += CHUNK_SIZE) {
                    let chunk = imageDataBytes.slice(i, i + CHUNK_SIZE);
                    if (bluetoothCharacteristic.writeValueWithoutResponse) {
                        await bluetoothCharacteristic.writeValueWithoutResponse(chunk);
                    } else {
                        await bluetoothCharacteristic.writeValue(chunk);
                    }
                    if (DELAY_MS > 0) {
                        await new Promise(resolve => setTimeout(resolve, DELAY_MS));
                    }
                }

                statusText.innerText = "¡Impresión exitosa!";
            } catch (error) {
                console.error(error);
                actualizarEstadoUI(false, "Error de impresión");
                alert("Error: " + error.message);
            }
        });
    </script>
</body>
</html>
